name: ShutterUpskal Windows final preview

on:
  workflow_dispatch:
  push:
    branches:
      - release/shutterupskal-stock-2.15.0

permissions:
  contents: read

concurrency:
  group: shutterupskal-windows-final
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out ShutterUpskal
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.5
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run tsc

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Upload ShutterUpskal Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ShutterUpskal-2.15.0-Windows-final-test
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
