name: ShutterUpskal Windows installer check
on:
  pull_request:
    branches: [efv-shutterupskal]
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed Windows installer (requires certificate secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require certificate for signed release
        if: ${{ inputs.signed_release == true }}
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.EFV_WINDOWS_CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.EFV_WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE -or -not $env:CERTIFICATE_PASSWORD) {
            throw 'Signing certificate secrets are not configured. Refusing unsigned release.'
          }
      - name: Build renderer and Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ inputs.signed_release == true && secrets.EFV_WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release == true && secrets.EFV_WINDOWS_CSC_KEY_PASSWORD || '' }}
      - name: Verify signed installer Authenticode signature
        if: ${{ inputs.signed_release == true }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No installer to verify' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($installer.Name): $($signature.Status)" }
            if ($signature.SignerCertificate.Subject -notmatch 'EF Ventures') { throw "Unexpected signing identity: $($signature.SignerCertificate.Subject)" }
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutterupskal-windows-${{ inputs.signed_release == true && 'signed' || 'unsigned-test' }}-installer
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
