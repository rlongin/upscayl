name: ShutterUpskal Windows installer check
on:
  pull_request:
    branches: [efv-shutterupskal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build renderer and Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload unsigned test installer
        uses: actions/upload-artifact@v4
        with:
          name: shutterupskal-windows-test-installer
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
