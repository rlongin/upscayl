name: ShutterUpskal stock cross-platform preview

on:
  workflow_dispatch:
  push:
    branches:
      - release/shutterupskal-stock-2.15.0

permissions:
  contents: read

concurrency:
  group: shutterupskal-stock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows stock Upscayl backend
    runs-on: windows-latest
    steps:
      - name: Check out minimally branded stock source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.5
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run tsc

      - name: Build Windows installer without touching inference backend
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: ShutterUpskal-2.15.0-stock-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS universal stock Upscayl backend
    runs-on: macos-13
    steps:
      - name: Check out minimally branded stock source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.5
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          rm -rf node_modules/sharp
          npm install --no-save --platform=darwin --arch=x64 sharp
          npm rebuild --platform=darwin --arch=arm64 sharp

      - name: TypeScript check
        run: npm run tsc

      - name: Create ShutterUpskal macOS icon
        run: |
          rm -rf build/ShutterUpskal.iconset
          mkdir -p build/ShutterUpskal.iconset
          sips -z 16 16 build/icon.png --out build/ShutterUpskal.iconset/icon_16x16.png
          sips -z 32 32 build/icon.png --out build/ShutterUpskal.iconset/icon_16x16@2x.png
          sips -z 32 32 build/icon.png --out build/ShutterUpskal.iconset/icon_32x32.png
          sips -z 64 64 build/icon.png --out build/ShutterUpskal.iconset/icon_32x32@2x.png
          sips -z 128 128 build/icon.png --out build/ShutterUpskal.iconset/icon_128x128.png
          sips -z 256 256 build/icon.png --out build/ShutterUpskal.iconset/icon_128x128@2x.png
          sips -z 256 256 build/icon.png --out build/ShutterUpskal.iconset/icon_256x256.png
          sips -z 512 512 build/icon.png --out build/ShutterUpskal.iconset/icon_256x256@2x.png
          sips -z 512 512 build/icon.png --out build/ShutterUpskal.iconset/icon_512x512.png
          sips -z 1024 1024 build/icon.png --out build/ShutterUpskal.iconset/icon_512x512@2x.png
          iconutil -c icns build/ShutterUpskal.iconset -o build/icon.icns

      - name: Disable signing only for this preview artifact
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); delete p.build.afterSign; delete p.build.mac.provisioningProfile; p.build.mac.identity=null; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"

      - name: Build universal Mac preview without touching inference backend
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Mac test build
        uses: actions/upload-artifact@v4
        with:
          name: ShutterUpskal-2.15.0-stock-macOS-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
