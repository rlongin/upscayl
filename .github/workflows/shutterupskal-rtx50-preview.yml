name: ShutterUpskal RTX 50 compatibility preview

on:
  workflow_dispatch:
  push:
    branches: [fix/rtx50-blackwell]

permissions:
  contents: read

env:
  NCNN_SHA: 6a1fce78027be7417c33406deac38b8ded428c34

jobs:
  windows-blackwell:
    runs-on: windows-latest
    steps:
      - name: Check out ShutterUpskal
        uses: actions/checkout@v4

      - name: Check out Upscayl NCNN backend
        uses: actions/checkout@v4
        with:
          repository: upscayl/upscayl-ncnn
          ref: master
          path: backend
          submodules: recursive

      - name: Pin current NCNN and initialize its submodules
        shell: pwsh
        run: |
          git -C backend/src/ncnn fetch https://github.com/Tencent/ncnn.git $env:NCNN_SHA
          git -C backend/src/ncnn checkout $env:NCNN_SHA
          git -C backend/src/ncnn submodule update --init --recursive

      - name: Apply RTX 50 / Blackwell compatibility options
        shell: pwsh
        run: |
          $path = "backend/src/realesrgan.cpp"
          $text = Get-Content $path -Raw
          $needle = @"
              net.opt.use_vulkan_compute = true;
              net.opt.use_fp16_packed = true;
          "@
          $replacement = @"
              net.opt.use_vulkan_compute = true;

              // RTX 50-series / Blackwell compatibility:
              // avoid Vulkan subgroup/tensor/cooperative-matrix paths that have
              // produced native access violations on current Windows drivers.
              net.opt.use_subgroup_ops = false;
              net.opt.use_tensor_storage = false;
              net.opt.use_cooperative_matrix = false;

              net.opt.use_fp16_packed = true;
          "@
          if (-not $text.Contains($needle)) {
            throw "Could not locate RealESRGAN Vulkan option block."
          }
          $text = $text.Replace($needle, $replacement)
          Set-Content $path $text -NoNewline

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/1.4.328.1/windows/VulkanSDK-1.4.328.1-Installer.exe?Human=true" -OutFile vk.exe
          7z x vk.exe -oVulkanSDK | Out-Null
          $sdk = (Resolve-Path "VulkanSDK").Path
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Blackwell-compatible backend
        shell: pwsh
        run: |
          cmake -S backend/src -B backend/build -A x64 -DNCNN_SIMPLEVK=OFF -DNCNN_VULKAN=ON
          cmake --build backend/build --config Release --parallel 2
          if (-not (Test-Path "backend/build/Release/upscayl-bin.exe")) {
            throw "Blackwell-compatible upscayl-bin.exe was not produced."
          }

      - name: Replace bundled Windows backend
        shell: pwsh
        run: |
          Copy-Item "backend/build/Release/upscayl-bin.exe" "resources/win/bin/upscayl-bin.exe" -Force
          Get-Item "resources/win/bin/upscayl-bin.exe" | Format-List Name,Length,LastWriteTime

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.5
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build ShutterUpskal Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload compatibility preview
        uses: actions/upload-artifact@v4
        with:
          name: ShutterUpskal-2.15.1-RTX50-preview
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
