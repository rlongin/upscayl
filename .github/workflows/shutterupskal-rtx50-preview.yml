name: ShutterUpskal 2.15.1 test installer

on:
  workflow_dispatch:
  push:
    branches: [fix/rtx50-blackwell]

permissions:
  contents: read

jobs:
  windows-test-installer:
    runs-on: windows-latest
    steps:
      - name: Check out ShutterUpskal
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.5
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run tsc

      - name: Build ShutterUpskal Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: ShutterUpskal-2.15.1-Windows-test
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
